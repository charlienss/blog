<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Qingyu'Blog · 零依赖轻量博客，双击即开；支持 Cloudflare Pages / Workers 云端存储。">
  <title>Qingyu'Blog · 轻量博客</title>
  <!-- 静态 base：彻底解决 /posts/<别名>/ 深度页面刷新时静态资源被按相对目录解析而 404 的问题。
       （此前用 JS 动态插入 base，会与浏览器的预加载扫描器产生竞态，直达子页时仍会 404。） -->
  <base href="/">
  <script>
    // file:// 本地双击直开时，把资源基准改回当前目录，保持本地预览可用；在线部署保持根路径。
    // 同时尽早应用主题，避免深色模式用户首屏白闪（FOUC）。
    (function () {
      if (/^file:/i.test(location.protocol)) {
        var b = document.querySelector('base');
        if (b) b.setAttribute('href', './');
      }
      try {
        var t = localStorage.getItem('qingyu.theme');
        if (t !== 'light' && t !== 'dark') {
          t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='42' fill='%23c25e3a'/></svg>">
  <style>
    /* 首屏加载动画：在 app.js 接管前显示，主题色与暖色调一致 */
    .boot-load {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; background: var(--bg, #faf7f2); z-index: 1000;
    }
    .boot-ring {
      width: 36px; height: 36px; position: relative;
    }
    .boot-ring::before, .boot-ring::after {
      content: ""; position: absolute; inset: 0; border-radius: 50%;
      border: 3px solid transparent; border-top-color: #c25e3a;
      animation: bootSpin 1s cubic-bezier(.5,.15,.75,.45) infinite;
    }
    .boot-ring::after { animation-delay: .15s; border-top-color: #e08a63; opacity: .7; }
    .boot-dot {
      width: 7px; height: 7px; border-radius: 50%; background: #cfc4b6;
      animation: bootPulse 1.2s ease-in-out infinite;
    }
    .boot-name { font-size: 13.5px; color: #9b8f83; letter-spacing: 3px; }
    @keyframes bootSpin { to { transform: rotate(360deg); } }
    @keyframes bootPulse { 0%,100% { opacity:.3; transform: scale(.8); } 50% { opacity:1; transform: scale(1.15); } }
    @media (prefers-color-scheme: dark) {
      .boot-load { background: #1d1a17; }
      .boot-dot { background: #6a6158; }
      .boot-name { color: #a89b8e; }
    }
  </style>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin.css">
  <!-- 预连接字体 CDN，降低首字节延迟 -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <!-- 字体：外部 CDN 样式表改为非阻塞加载（media=print + onload 切换），避免拖慢首屏渲染；
       本地分片字体（result.css）同域、体积小，保持常规加载 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@free-fonts/genyo-mincho@1.0.1/genyo-mincho.css" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@free-fonts/zhuque-fangsong@1.0.0/zhuque-fangsong.css" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cn-fontsource-source-han-serif-sc-vf@1.0.9/font.css" media="print" onload="this.media='all'">
  <noscript>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@free-fonts/genyo-mincho@1.0.1/genyo-mincho.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@free-fonts/zhuque-fangsong@1.0.0/zhuque-fangsong.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cn-fontsource-source-han-serif-sc-vf@1.0.9/font.css">
  </noscript>
  <link rel="stylesheet" href="fonts/dreamserif/result.css">
  <script defer src="config.js"></script>
  <script defer src="local-settings.js"></script>
  <script defer src="posts.js"></script>
  <script defer src="i18n.js"></script>
</head>
<body>
  <div id="app">
    <div class="boot-load" id="bootLoad">
      <div class="boot-ring"></div>
      <div class="boot-dot"></div>
      <div class="boot-name">Qingyu'Blog · 加载中</div>
    </div>
  </div>
  <script defer src="app.js"></script>
  <script defer src="admin.js"></script>
</body>
</html>
